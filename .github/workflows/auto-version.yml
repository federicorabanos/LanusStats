name: Auto version bump on merge to main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  bump-and-publish:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'bump: v')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Leer versión actual desde setup.py
        id: current
        run: |
          VERSION=$(python -c "import re; content=open('setup.py').read(); print(re.search(r\"VERSION = '(.+?)'\", content).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Calcular nueva versión (patch bump)
        id: new
        run: |
          VERSION=${{ steps.current.outputs.version }}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Nueva versión: $NEW_VERSION"

      - name: Actualizar setup.py
        run: |
          NEW_VERSION=${{ steps.new.outputs.version }}
          sed -i "s/VERSION = '.*'/VERSION = '$NEW_VERSION'/" setup.py

      - name: Actualizar CHANGELOG.md
        run: |
          NEW_VERSION=${{ steps.new.outputs.version }}
          DATE=$(date +%Y-%m-%d)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          { head -1 CHANGELOG.md; printf "\n## [%s] - %s\n\n### Changed\n- %s\n" "$NEW_VERSION" "$DATE" "$COMMIT_MSG"; tail -n +2 CHANGELOG.md; } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit y tag
        run: |
          NEW_VERSION=${{ steps.new.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add setup.py CHANGELOG.md
          git commit -m "bump: v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin main --tags

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.new.outputs.version }}
          name: v${{ steps.new.outputs.version }}
          generate_release_notes: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Build y publish a PyPI
        run: |
          pip install setuptools wheel twine
          python setup.py sdist bdist_wheel
          python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
